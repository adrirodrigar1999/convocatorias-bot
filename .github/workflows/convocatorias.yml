name: Convocatorias

# El bot se ejecuta en el Mac (scripts/mac). Este workflow queda para pruebas manuales:
# diagnóstico de fuentes y simulaciones del BOE, sin enviar nada ni guardar estado.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha concreta AAAA-MM-DD (vacío = días pendientes)"
        required: false
        default: ""
      dry_run:
        description: "Solo mostrar en el log, sin enviar ni guardar"
        type: boolean
        default: true
      probar_fuentes:
        description: "Diagnóstico de boletines y webs (no envía nada)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: convocatorias
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Diagnóstico de fuentes
        if: inputs.probar_fuentes == true
        run: python -m bot.main --probar-fuentes

      - name: Revisar boletines
        if: inputs.probar_fuentes != true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FECHA: ${{ inputs.fecha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$FECHA" ]; then ARGS="$ARGS --fecha $FECHA"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot.main $ARGS
