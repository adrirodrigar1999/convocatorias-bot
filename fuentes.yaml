# Fuentes que revisa el bot además del BOE.
#
#   tipo: boletin | web
#   region: Asturias | Castilla y León | Cantabria  -> cualquier plaza accesible con tu titulación
#           (vacío)                                 -> solo plazas de informática
#   url: admite {yyyy} {mm} {dd} {yyyymmdd} para páginas que cambian cada día
#   seguir: (opcional) regex del texto de los enlaces que llevan al listado real
#   informatica: true  -> todo lo que publica cuenta como informática (p. ej. INCIBE)
#   verificada: true   -> URL comprobada a mano; el resto se valida con --probar-fuentes
#   activa: false      -> desactivarla sin borrarla
#   verificar_ssl: false -> solo para webs públicas con el certificado mal instalado
#
# Para añadir una fuente basta con copiar un bloque. Si una deja de funcionar, el bot avisa.

