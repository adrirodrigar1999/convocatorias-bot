# Procesos selectivos a los que te has presentado y que el bot vigila a diario.
#
# A diferencia de la búsqueda de convocatorias, aquí se avisa de TODO lo que salga del proceso
# (listas de admitidos, tribunal, fecha de examen, notas, bolsa...), aunque no abra plazo.
#
#   id        identificador corto (no lo cambies: es la memoria de lo ya avisado)
#   nombre    cómo aparece en el aviso
#   buscar    expresión regular (sin tildes, sin distinguir mayúsculas) que debe aparecer en el anuncio
#   excluir   (opcional) expresión que descarta el anuncio aunque cumpla «buscar»
#   hasta     (opcional) fecha a partir de la cual se deja de vigilar
#   fuentes   ids de fuentes.yaml en las que mirar (sus sumarios del día)
#   urls      (opcional) páginas concretas a mirar tal cual, sin seguir enlaces (tablones de anuncios...)

- id: tai-dipu-guadalajara-2026
  nombre: Técnico/a Auxiliar Informática · Diputación de Guadalajara
  buscar: 'auxiliar\W+(de\W+)?informatica|\btai\b'
  excluir: 'ayuntamiento'
  hasta: 2027-12-31
  fuentes: [bop-guadalajara]
  urls:
    - https://www.dguadalajara.es/web/guest/tablon-informativo

# En el BOCM el sumario a veces solo dice «Guadarrama. Ofertas de empleo. Proceso selectivo»,
# así que basta con que sea de Guadarrama y hable de empleo (puede colarse algún otro proceso del Ayto.).
- id: gestion-informatica-guadarrama-2026
  nombre: Técnico/a de Gestión Informática · Ayto. de Guadarrama
  buscar: '(?=.*guadarrama)(?=.*(ofertas? de empleo|proceso selectivo|admitidos|tribunal|gestion\W+informatica))'
  hasta: 2027-12-31
  fuentes: [bocm]

- id: bolsa-tm-informatica-manises-2026
  nombre: Bolsa de Técnico/a Medio/a de Informática · Ayto. de Manises
  buscar: '(?=.*manises)(?=.*informatic)'
  hasta: 2027-12-31
  fuentes: [bop-valencia, dogv]
